{% extends 'web/base.html' %}
{% block title %}{{ title }} · AppCentre{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}{{ center.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="app-card">
      <div class="app-card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'web/includes/form_fields.html' %}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Enregistrer</button>
            <a href="{% url 'web:manager_schedule' %}" class="btn btn-light">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
